<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#225c5a" stroke="#73a9a7" stroke-width="5"/>

  <!-- Justice scales symbol -->
  <g transform="translate(100, 60)">
    <!-- Pole -->
    <rect x="-3" y="0" width="6" height="70" fill="#ffffff"/>

    <!-- Balance beam -->
    <rect x="-50" y="15" width="100" height="4" fill="#ffffff"/>

    <!-- Left scale -->
    <path d="M -40 15 L -50 35 L -30 35 Z" fill="#f4c430" stroke="#ffffff" stroke-width="2"/>
    <line x1="-40" y1="15" x2="-40" y2="35" stroke="#ffffff" stroke-width="1"/>

    <!-- Right scale -->
    <path d="M 40 15 L 30 35 L 50 35 Z" fill="#f4c430" stroke="#ffffff" stroke-width="2"/>
    <line x1="40" y1="15" x2="40" y2="35" stroke="#ffffff" stroke-width="1"/>

    <!-- Triangle on top -->
    <path d="M 0 0 L -8 15 L 8 15 Z" fill="#f4c430"/>
  </g>

  <!-- Text ASPJ-PE -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">
    ASPJ-PE
  </text>
</svg>
